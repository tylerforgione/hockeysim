name: Validate

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs these same checks on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore HockeySim.slnx
      - run: dotnet format HockeySim.slnx --verify-no-changes --no-restore --severity warn

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore HockeySim.slnx
      - run: dotnet build HockeySim.slnx --configuration Release --no-restore
      - name: Test each project
        if: hashFiles('tests/**/*.Tests.csproj') != ''
        shell: pwsh
        run: |
          $testProjects = @(Get-ChildItem tests -Recurse -Filter *.Tests.csproj)
          # Run the projects at the same time; each project's output is printed as one group after all finish.
          $results = $testProjects | ForEach-Object -ThrottleLimit $testProjects.Count -Parallel {
            $coverageFile = "$($_.BaseName).cobertura.xml"
            $output = dotnet test --project $_.FullName --configuration Release --no-build --no-restore --minimum-expected-tests 1 --coverage --coverage-output $coverageFile --coverage-output-format cobertura 2>&1
            [pscustomobject]@{ Name = $_.BaseName; ExitCode = $LASTEXITCODE; Output = $output }
          }
          $failed = $false
          foreach ($result in $results | Sort-Object Name) {
            "::group::$($result.Name) (exit code $($result.ExitCode))"
            $result.Output | ForEach-Object { "$_" }
            "::endgroup::"
            if ($result.ExitCode -ne 0) {
              "::error::$($result.Name) failed with exit code $($result.ExitCode)."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Upload coverage reports
        if: hashFiles('tests/**/*.Tests.csproj') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/*.cobertura.xml
          if-no-files-found: error
      - name: Report pending test scaffolding
        if: hashFiles('tests/**/*.Tests.csproj') == ''
        shell: pwsh
        run: |
          "No test projects exist yet. Only restore and build were validated; application tests and coverage are pending. See docs/testing.md." >> $env:GITHUB_STEP_SUMMARY
